server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Скрыть версию nginx
    server_tokens off;

    # --- Gzip ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # --- Security-заголовки ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- HTML: короткий кэш, чтобы обновления памятки подхватывались ---
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- SPA-fallback: любые пути отдают index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Не отдавать скрытые файлы ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Healthcheck ---
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
